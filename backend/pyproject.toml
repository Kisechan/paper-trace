[project]
name = "paper-trace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "asyncpg>=0.30,<1", "pymupdf>=1.25,<2", "httpx>=0.28,<1", "openai>=1.60,<3", "pydantic-settings>=2.7,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
